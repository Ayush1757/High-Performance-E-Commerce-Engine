version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: aurastore_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  redis:
    image: redis:7-alpine
    container_name: aurastore_redis
    ports:
      - "6379:6379"

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: aurastore_server
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/ecommerce-ai-engine
      - REDIS_URI=redis://redis:6379
      - JWT_SECRET=production_secret_key_987654321
      - NODE_ENV=production
      - CLIENT_URL=http://localhost
    depends_on:
      - mongodb
      - redis

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: aurastore_client
    ports:
      - "80:80"
    environment:
      - VITE_API_URL=http://localhost:5000/api
    depends_on:
      - server

volumes:
  mongodb_data:
